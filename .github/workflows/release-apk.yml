name: Build & Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag (e.g., v2.0) to publish a GitHub Release"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Accept Android SDK licenses
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Build APK
        id: build
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p dist
          VERSION_TAG="${{ inputs.release_tag }}"
          if [ -z "$VERSION_TAG" ] && [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION_TAG="${GITHUB_REF_NAME}"
          fi
          SUFFIX="${VERSION_TAG:-dev}"

          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "Release signing secrets detected — building signed release APK..."
            echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
            trap 'rm -f my-upload-key.jks' EXIT
            gradle :app:assembleRelease --no-daemon
            APK_NAME="RF-Power-VSWR-${SUFFIX}-release.apk"
            cp app/build/outputs/apk/release/app-release.apk "dist/${APK_NAME}"
            echo "variant=release" >> "$GITHUB_OUTPUT"
          else
            echo "Release signing secrets not configured — building signed debug APK fallback..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            trap 'rm -f debug.keystore' EXIT
            gradle :app:assembleDebug --no-daemon
            APK_NAME="RF-Power-VSWR-${SUFFIX}-debug.apk"
            cp app/build/outputs/apk/debug/app-debug.apk "dist/${APK_NAME}"
            echo "variant=debug" >> "$GITHUB_OUTPUT"
          fi

          echo "apk_path=dist/${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.apk_name }}
          path: ${{ steps.build.outputs.apk_path }}

      - name: Publish GitHub Release
        if: steps.build.outputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.build.outputs.release_tag }}
          name: "RF Power & VSWR ${{ steps.build.outputs.release_tag }}"
          generate_release_notes: true
          files: ${{ steps.build.outputs.apk_path }}
          body: |
            ### Download & Install on Android
            1. Tap **${{ steps.build.outputs.apk_name }}** under **Assets** below to download the APK.
            2. Open the downloaded `.apk` file on your Android device (Android 7.0 / API 24 or newer).
            3. If prompted, enable **Install unknown apps** for your browser or file manager, then tap **Install**.
